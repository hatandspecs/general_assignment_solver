[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allocsolver"
version = "0.1.0"
description = "MILP-driven labor allocation and spend planning"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "ortools>=9.10",
    "polars>=1.0",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "rich>=13",
    "tomli-w>=1.0",
    "holidays>=0.55",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
iis = ["PySCIPOpt>=5.0"]
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "hypothesis>=6.100", "ruff", "mypy"]

[project.scripts]
allocsolver = "allocsolver.cli:app"

[tool.setuptools.packages.find]
include = ["allocsolver*"]
